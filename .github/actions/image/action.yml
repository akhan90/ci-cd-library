name: 'Image - Build with Jib'
description: 'Builds Docker image using Gradle Jib (with optional push)'

inputs:
  java-version:
    description: 'Java version to use'
    required: false
    default: '21'
  image-registry:
    description: 'Container registry URL'
    required: true
  image-name:
    description: 'Image name'
    required: true
  image-tag:
    description: 'Image tag'
    required: false
    default: 'latest'
  push:
    description: 'Push image to registry (false = build only)'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: ${{ inputs.java-version }}
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      shell: bash
      run: chmod +x ./gradlew

    - name: Build and push image
      if: inputs.push == 'true'
      shell: bash
      run: |
        echo "Building and pushing: ${{ inputs.image-registry }}/${{ inputs.image-name }}:${{ inputs.image-tag }}"
        ./gradlew jib \
          -Djib.to.image=${{ inputs.image-registry }}/${{ inputs.image-name }}:${{ inputs.image-tag }}
        echo "Image pushed"

    - name: Build image (no push)
      if: inputs.push == 'false'
      shell: bash
      run: |
        echo "Building (no push): ${{ inputs.image-registry }}/${{ inputs.image-name }}:${{ inputs.image-tag }}"
        ./gradlew jibDockerBuild \
          -Djib.to.image=${{ inputs.image-registry }}/${{ inputs.image-name }}:${{ inputs.image-tag }}
        echo "Image built locally"
