name: 'Image - Build with Jib'
description: 'Builds Docker image using Gradle Jib (with optional push)'

inputs:
  java-version:
    description: 'Java version to use'
    required: false
    default: '21'
  gradle-version:
    description: 'Gradle version'
    required: false
    default: '8.5'
  image-registry:
    description: 'Container registry URL'
    required: true
  image-name:
    description: 'Image name'
    required: true
  image-tag:
    description: 'Image tag'
    required: false
    default: 'latest'
  push:
    description: 'Push image to registry (false = build only)'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: ${{ inputs.java-version }}
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: ${{ inputs.gradle-version }}

    - name: Build and push image
      if: inputs.push == 'true'
      shell: bash
      run: |
        echo "Building and pushing: ${{ inputs.image-registry }}/${{ inputs.image-name }}:${{ inputs.image-tag }}"
        gradle jib \
          -Djib.to.image=${{ inputs.image-registry }}/${{ inputs.image-name }}:${{ inputs.image-tag }}
        echo "✅ Image pushed"

    - name: Build image (no push)
      if: inputs.push == 'false'
      shell: bash
      run: |
        echo "Building (no push): ${{ inputs.image-registry }}/${{ inputs.image-name }}:${{ inputs.image-tag }}"
        gradle jibDockerBuild \
          -Djib.to.image=${{ inputs.image-registry }}/${{ inputs.image-name }}:${{ inputs.image-tag }}
        echo "✅ Image built locally"
