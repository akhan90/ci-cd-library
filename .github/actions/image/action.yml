name: 'Image - Build with Jib'
description: 'Builds and pushes Docker image using Gradle Jib'

inputs:
  java-version:
    description: 'Java version to use'
    required: false
    default: '21'
  image-registry:
    description: 'Container registry URL'
    required: true
  image-name:
    description: 'Image name'
    required: true
  image-tag:
    description: 'Image tag'
    required: false
    default: 'latest'

runs:
  using: 'composite'
  steps:
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: ${{ inputs.java-version }}
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      shell: bash
      run: chmod +x ./gradlew

    - name: Build and push image with Jib
      shell: bash
      run: |
        echo "Building image: ${{ inputs.image-registry }}/${{ inputs.image-name }}:${{ inputs.image-tag }}"
        ./gradlew jib \
          -Djib.to.image=${{ inputs.image-registry }}/${{ inputs.image-name }}:${{ inputs.image-tag }}
        echo "✅ Image pushed successfully"
