name: 'Image Scan'
description: 'Scan container image for vulnerabilities using Trivy'

inputs:
  image-ref:
    description: 'Image to scan (e.g., registry/image:tag)'
    required: true
  severity:
    description: 'Severity levels to check (CRITICAL,HIGH,MEDIUM,LOW)'
    required: false
    default: 'CRITICAL,HIGH'
  exit-code:
    description: 'Exit code when vulnerabilities found (0 = warn, 1 = fail)'
    required: false
    default: '1'

runs:
  using: 'composite'
  steps:
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ inputs.image-ref }}
        format: 'table'
        exit-code: ${{ inputs.exit-code }}
        severity: ${{ inputs.severity }}

    - name: Scan complete
      shell: bash
      run: echo "Image scan completed"
