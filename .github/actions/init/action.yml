name: 'Init - YAML Validation'
description: 'Validates YAML files in the repository'

inputs:
  yaml-paths:
    description: 'Paths to validate (space-separated)'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: Install yamllint
      shell: bash
      run: pip install yamllint

    - name: Validate YAML files
      shell: bash
      run: |
        echo "Validating YAML files in: ${{ inputs.yaml-paths }}"
        
        # Find YAML files excluding .github directory
        YAML_FILES=$(find ${{ inputs.yaml-paths }} -type f \( -name "*.yml" -o -name "*.yaml" \) ! -path "./.github/*" 2>/dev/null || true)
        
        if [ -z "$YAML_FILES" ]; then
          echo "No YAML files found (excluding .github/) - skipping validation"
          exit 0
        fi
        
        echo "Found YAML files:"
        echo "$YAML_FILES"
        
        # Run yamllint with relaxed rules
        echo "$YAML_FILES" | xargs yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}}}" || true
        echo "YAML validation completed"
